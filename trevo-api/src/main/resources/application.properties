spring.application.name=trevo-api
server.port=${SERVER_PORT:8080}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/trevo}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:trevo}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:trevo}

spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

app.security.jwt.secret=${APP_SECURITY_JWT_SECRET:change-me-to-a-secure-32-byte-secret-key}
app.security.jwt.expiration=PT15M

# Flyway properties:
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
